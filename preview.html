<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouAuto — Service Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dde1e6;
    --text: #1a1c23;
    --text-secondary: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --row-hover: #f0f4ff;
    --badge-bg: #e8edf9;
    --badge-text: #3b5998;
    --radius: 10px;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }

  h1 {
    font-size: 1.6rem; font-weight: 700;
    display: flex; align-items: center; gap: 10px; margin-bottom: 2px;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text-secondary); margin-bottom: 16px; font-size: 0.9rem; }

  /* --- INPUT CARD --- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .input-row {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
  .field input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.9rem; width: 160px; transition: border-color .15s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .field.wide input { width: 240px; }
  .field select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.9rem; background: var(--surface); color: var(--text);
    cursor: pointer; transition: border-color .15s;
  }

  button {
    padding: 9px 18px; border: none; border-radius: 6px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }

  /* --- SPLIT LAYOUT --- */
  .main-area {
    display: flex; gap: 14px;
    height: calc(100vh - 260px);       /* cap to viewport */
    min-height: 420px;
  }
  .map-pane  { flex: 1 1 55%; min-width: 0; }
  .list-pane { flex: 1 1 45%; min-width: 340px; display: flex; flex-direction: column; overflow: hidden; }

  #map {
    width: 100%; height: 100%;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    background: #e8e4df;
  }

  /* --- RESULTS --- */
  .results-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-wrap: wrap; gap: 8px; flex-shrink: 0;
  }
  .results-header h2 { font-size: 1rem; font-weight: 600; }
  .count { font-size: 0.8rem; color: var(--text-secondary); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    flex: 1; display: flex; flex-direction: column;
  }
  .table-scroll { overflow-y: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th {
    text-align: left; padding: 9px 10px; position: sticky; top: 0; z-index: 2;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-secondary); border-bottom: 2px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none;
    background: var(--surface);
  }
  th:hover { color: var(--text); }
  td { padding: 7px 10px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
  tr.result-row { cursor: pointer; transition: background .1s; }
  tr.result-row:hover { background: var(--row-hover); }
  tr.result-row.highlight { background: #dbeafe; }
  tr.result-row:last-child td { border-bottom: none; }

  .name-cell { font-weight: 600; }
  .web-link {
    font-size: 0.75rem; margin-left: 4px; opacity: .6;
    text-decoration: none; transition: opacity .15s;
  }
  .web-link:hover { opacity: 1; }
  .dist-badge {
    display: inline-block; background: var(--accent); color: #fff;
    padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    white-space: nowrap;
  }
  .svc-badge {
    display: inline-block; background: var(--badge-bg); color: var(--badge-text);
    padding: 1px 7px; border-radius: 4px; font-size: 0.72rem;
    margin: 1px 2px 1px 0;
  }
  .source-tag {
    display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 1px 6px;
    border-radius: 3px; text-transform: uppercase; letter-spacing: .04em;
  }
  .src-mech  { background: #dbeafe; color: #1e40af; }
  .src-tow   { background: #fef3c7; color: #92400e; }
  .src-parts { background: #ede9fe; color: #5b21b6; }

  .empty {
    text-align: center; padding: 36px 16px; color: var(--text-secondary);
    font-size: 0.9rem;
  }

  /* --- PAGINATION --- */
  .pagination {
    display: flex; justify-content: center; align-items: center; gap: 5px;
    padding: 10px 0 4px; flex-shrink: 0; user-select: none;
  }
  .pagination button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 0.8rem; font-weight: 500; cursor: pointer;
    background: var(--surface); color: var(--text);
  }
  .pagination button:hover { background: var(--row-hover); }
  .pagination button:disabled { opacity: .4; cursor: default; background: var(--surface); }
  .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pagination .page-info { font-size: 0.78rem; color: var(--text-secondary); margin: 0 5px; }

  /* --- LEAFLET POPUP OVERRIDES --- */
  .leaflet-popup-content { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 0.85rem; line-height: 1.4; }
  .leaflet-popup-content strong { font-size: 0.95rem; }
  .leaflet-popup-content .popup-addr { color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px; }
  .leaflet-popup-content .popup-svcs { margin-top: 4px; }
  .leaflet-popup-content .popup-link { margin-top: 6px; font-size: 0.8rem; }
  .leaflet-popup-content .popup-link a { color: var(--accent); }

  .geo-status { font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; min-height: 1.2em; }
  .use-my-location {
    font-size: 0.8rem; color: var(--accent); cursor: pointer; background: none; border: none;
    padding: 0; font-weight: 500; text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">

  <h1>🔧 You<span>Auto</span></h1>
  <p class="subtitle">Nebraska auto service finder — mechanics &amp; towing sorted by distance</p>

  <div class="card">
    <div class="input-row">
      <div class="field" style="flex:1; min-width:220px;">
        <label for="address">Address or place</label>
        <input id="address" type="text" placeholder="e.g. 123 Main St, Omaha, NE or just Lincoln, NE" value="Lincoln, NE">
      </div>
      <button id="useLocationBtn" class="use-my-location" style="text-decoration:none; background:none; color:var(--accent); padding:0; align-self:flex-end; margin-bottom:3px;">
        📍 Use my location
      </button>
      <div class="field">
        <label for="typeFilter">Type</label>
        <select id="typeFilter">
          <option value="all">All</option>
          <option value="Mechanic">Mechanic</option>
          <option value="Towing">Towing</option>
          <option value="Parts">Parts</option>
        </select>
      </div>
      <div class="field" style="flex:1; min-width:180px;">
        <label for="service">Service (optional)</label>
        <input id="service" type="text" placeholder="e.g. transmission, oil change, brakes…">
      </div>
      <div class="field">
        <label for="maxDist">Max distance (mi)</label>
        <input id="maxDist" type="number" placeholder="unlimited" min="1" style="width:100px;">
      </div>
      <button id="searchBtn">Search</button>
    </div>
    <div class="geo-status" id="geocodeStatus"></div>
  </div>

  <div class="main-area">
    <div class="map-pane"><div id="map"></div></div>
    <div class="list-pane" id="resultsArea">
      <div class="results-header">
        <h2>Results</h2>
        <span class="count" id="resultCount"></span>
      </div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th data-col="distance">Dist</th>
                <th data-col="name">Name</th>
                <th data-col="city">City</th>
                <th data-col="source">Source</th>
                <th data-col="services">Services</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// ── CSV parser (handles quoted fields & embedded commas) ──
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) {
        row.push(field); rows.push(row); row = []; field = '';
        if (ch === '\r') i++;
      } else if (ch === '\r') {
        row.push(field); rows.push(row); row = []; field = '';
      }
      else { field += ch; }
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// ── Haversine ──
function toRad(d) { return d * Math.PI / 180; }
function haversineMiles(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── Global state ──
let allRows = [];
let currentSort = { col: 'distance', asc: true };
let map = null;
let markers = [];        // Leaflet marker objects
let currentResults = []; // latest search results for cross-linking
let lastSearchLat = null, lastSearchLon = null; // for re-render after sort
const PAGE_SIZE = 25;
let currentPage = 1;

// ── Map initialisation ──
function initMap(lat, lon) {
  if (!map) {
    map = L.map('map', { zoomControl: true }).setView([lat, lon], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);
  } else {
    map.setView([lat, lon], 10);
  }
}

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

// Custom coloured circle markers — blue for mechanics, amber for towing
const mechIcon = L.divIcon({
  className: 'custom-marker',
  html: '<div style="background:#2563eb;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>',
  iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -13],
});
const towIcon = L.divIcon({
  className: 'custom-marker',
  html: '<div style="background:#d97706;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>',
  iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -13],
});
const partsIcon = L.divIcon({
  className: 'custom-marker',
  html: '<div style="background:#7c3aed;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>',
  iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -13],
});
const youIcon = L.divIcon({
  className: 'custom-marker',
  html: '<div style="background:#16a34a;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;">📍</div>',
  iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16],
});

function addMarkers(results, searchLat, searchLon) {
  clearMarkers();

  // Search origin marker
  const youMarker = L.marker([searchLat, searchLon], { icon: youIcon })
    .addTo(map)
    .bindPopup('<strong>Your search location</strong>');
  markers.push(youMarker);

  const bounds = L.latLngBounds([searchLat, searchLon]);

  results.forEach((r, i) => {
    const icon = r.source === 'Towing' ? towIcon : r.source === 'Parts' ? partsIcon : mechIcon;
    const svcStr = r.services.length
      ? r.services.map(s => `<span class="svc-badge">${escHtml(s)}</span>`).join(' ')
      : '<em style="color:#999;">No services listed</em>';

    const marker = L.marker([r.lat, r.lon], { icon })
      .addTo(map)
      .bindPopup(`
        <strong>${escHtml(r.name)}</strong>
        <span class="source-tag ${r.source === 'Mechanic' ? 'src-mech' : r.source === 'Towing' ? 'src-tow' : 'src-parts'}" style="margin-left:6px;">${r.source}</span>
        <div class="popup-addr">${escHtml(r.address || r.city + (r.state ? ', ' + r.state : ''))}</div>
        ${r.website ? `<div class="popup-web"><a href="${escHtml(r.website)}" target="_blank">🌐 ${escHtml(r.website)}</a></div>` : ''}
        <div class="popup-svcs">${svcStr}</div>
        <div class="popup-link">
          <a href="${escHtml(r.osm_url || '#')}" target="_blank">View on OpenStreetMap ↗</a>
          &nbsp;·&nbsp; ${r.distance.toFixed(1)} mi
        </div>
      `);

    marker._youautoIdx = i; // store result index for cross-linking
    marker.on('click', () => highlightTableRow(i));

    markers.push(marker);
    bounds.extend([r.lat, r.lon]);
  });

  if (results.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
  }
}

function highlightTableRow(idx) {
  document.querySelectorAll('tr.result-row').forEach(tr => tr.classList.remove('highlight'));
  const row = document.querySelector(`tr.result-row[data-idx="${idx}"]`);
  if (row) {
    row.classList.add('highlight');
    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ── Load CSVs ──
async function loadData() {
  try {
    const ts = Date.now();
    const [mechResp, towResp, partsResp] = await Promise.all([
      fetch(`ne_mechanics.csv?t=${ts}`), fetch(`ne_towing.csv?t=${ts}`), fetch(`ne_parts.csv?t=${ts}`)
    ]);
    const mechText  = await mechResp.text();
    const towText   = await towResp.text();
    const partsText = await partsResp.text();

    const mechRows  = parseCSV(mechText);
    const towRows   = parseCSV(towText);
    const partsRows = parseCSV(partsText);

    const mechHeader  = mechRows[0];
    const towHeader   = towRows[0];
    const partsHeader = partsRows[0];

    const mIdx = {};
    mechHeader.forEach((h, i) => { mIdx[h.trim().toLowerCase()] = i; });
    const tIdx = {};
    towHeader.forEach((h, i) => { tIdx[h.trim().toLowerCase()] = i; });
    const pIdx = {};
    partsHeader.forEach((h, i) => { pIdx[h.trim().toLowerCase()] = i; });

    allRows = [];

    for (let r = 1; r < mechRows.length; r++) {
      const row = mechRows[r];
      const lat = parseFloat(row[mIdx.lat]);
      const lon = parseFloat(row[mIdx.lon]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const name = (row[mIdx.name] || '').trim();
      if (!name) continue;
      allRows.push({
        name, city: row[mIdx.city] || '', state: row[mIdx.state] || '',
        lat, lon, address: row[mIdx.address] || '',
        phone: row[mIdx.phone] || '', website: row[mIdx.website] || '',
        hours: row[mIdx.opening_hours] || '',
        services: (row[mIdx.services] || '').split(';').map(s => s.trim()).filter(Boolean),
        osm_url: row[mIdx.osm_url] || '', source: 'Mechanic',
      });
    }

    for (let r = 1; r < towRows.length; r++) {
      const row = towRows[r];
      const lat = parseFloat(row[tIdx.lat]);
      const lon = parseFloat(row[tIdx.lon]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const name = (row[tIdx.name] || '').trim();
      if (!name) continue;
      allRows.push({
        name, city: row[tIdx.city] || '', state: row[tIdx.state] || '',
        lat, lon, address: row[tIdx.address] || '',
        phone: row[tIdx.phone] || '', website: row[tIdx.website] || '',
        hours: row[tIdx.opening_hours] || '',
        services: (row[tIdx.services] || '').split(';').map(s => s.trim()).filter(Boolean),
        osm_url: row[tIdx.osm_url] || '', source: 'Towing',
      });
    }

    // Parts stores
    for (let r = 1; r < partsRows.length; r++) {
      const row = partsRows[r];
      const lat = parseFloat(row[pIdx.lat]);
      const lon = parseFloat(row[pIdx.lon]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const name = (row[pIdx.name] || '').trim();
      if (!name) continue;
      allRows.push({
        name, city: row[pIdx.city] || '', state: row[pIdx.state] || '',
        lat, lon, address: row[pIdx.address] || '',
        phone: row[pIdx.phone] || '', website: row[pIdx.website] || '',
        hours: row[pIdx.opening_hours] || '',
        services: (row[pIdx.services] || '').split(';').map(s => s.trim()).filter(Boolean),
        osm_url: row[pIdx.osm_url] || '', source: 'Parts',
      });
    }

    const withCity = allRows.filter(r => r.city).length;
    console.log(`Loaded ${allRows.length} entries (${mechRows.length - 1} mechanics, ${towRows.length - 1} towing, ${partsRows.length - 1} parts) — ${withCity} with city`);
  } catch (err) {
    console.error('Failed to load CSV files:', err);
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="5" class="empty">⚠️ Could not load data files. Make sure you're serving this directory (e.g. <code>python -m http.server 8080</code>).</td></tr>`;
  }
}

// ── Geocode ──
async function geocode(address) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!data.length) return null;
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display: data[0].display_name };
}

async function reverseGeocode(lat, lon) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
  const resp = await fetch(url);
  const data = await resp.json();
  return data.display_name || `${lat}, ${lon}`;
}

// ── Search & render ──
async function doSearch() {
  const address = document.getElementById('address').value.trim();
  const typeFilter = document.getElementById('typeFilter').value;
  const svcFilter = document.getElementById('service').value.trim().toLowerCase();
  const maxDistRaw = document.getElementById('maxDist').value.trim();
  const maxDist = maxDistRaw ? parseFloat(maxDistRaw) : Infinity;
  const statusEl = document.getElementById('geocodeStatus');

  if (!address) {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="5" class="empty">Please enter an address or place name.</td></tr>`;
    clearMarkers();
    return;
  }

  currentPage = 1;
  statusEl.textContent = 'Looking up address…';
  const geo = await geocode(address);
  if (!geo) {
    statusEl.textContent = '';
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="5" class="empty">Could not find that address. Try being more specific (e.g. "123 Main St, Omaha, NE").</td></tr>`;
    clearMarkers();
    return;
  }
  statusEl.textContent = `📍 ${geo.display}`;
  lastSearchLat = geo.lat; lastSearchLon = geo.lon;

  initMap(geo.lat, geo.lon);

  let results = allRows.map(r => ({
    ...r, distance: haversineMiles(geo.lat, geo.lon, r.lat, r.lon)
  }));

  // Filter by type (Mechanic / Towing / all)
  if (typeFilter !== 'all') {
    results = results.filter(r => r.source === typeFilter);
  }

  // Filter by service keyword
  if (svcFilter) {
    results = results.filter(r =>
      r.services.some(s => s.toLowerCase().includes(svcFilter)) ||
      r.name.toLowerCase().includes(svcFilter)
    );
  }

  // Filter by maximum distance
  if (isFinite(maxDist) && maxDist > 0) {
    results = results.filter(r => r.distance <= maxDist);
  }

  sortResults(results, currentSort.col, currentSort.asc);
  currentResults = results;
  renderTable(results);
  addMarkers(results, geo.lat, geo.lon);
}

function sortResults(results, col, asc) {
  results.sort((a, b) => {
    let va, vb;
    switch (col) {
      case 'distance': va = a.distance; vb = b.distance; break;
      case 'name':     va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'city':     va = a.city.toLowerCase(); vb = b.city.toLowerCase(); break;
      case 'source':   va = a.source; vb = b.source; break;
      default:         va = a.distance; vb = b.distance;
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
}

function renderTable(results) {
  const tbody = document.getElementById('tableBody');
  const totalPages = Math.ceil(results.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = Math.max(totalPages, 1);

  document.getElementById('resultCount').textContent =
    `${results.length} result${results.length !== 1 ? 's' : ''}${totalPages > 1 ? ` · page ${currentPage} of ${totalPages}` : ''}`;

  if (!results.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No results found. Try a different location or service filter.</td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const page = results.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = page.map((r, pi) => {
    const globalIdx = start + pi;
    return `
    <tr class="result-row" data-idx="${globalIdx}" title="Click to show on map">
      <td><span class="dist-badge">${r.distance.toFixed(1)} mi</span></td>
      <td class="name-cell">
        ${escHtml(r.name)}
        ${r.website ? `<a href="${escHtml(r.website)}" target="_blank" class="web-link" title="Visit website" onclick="event.stopPropagation()">🔗</a>` : ''}
      </td>
      <td>${escHtml(r.city || '—')}</td>
      <td><span class="source-tag ${r.source === 'Mechanic' ? 'src-mech' : r.source === 'Towing' ? 'src-tow' : 'src-parts'}">${r.source}</span></td>
      <td>${r.services.slice(0, 5).map(s => `<span class="svc-badge">${escHtml(s)}</span>`).join('')}${r.services.length > 5 ? ` +${r.services.length - 5} more` : ''}</td>
    </tr>
  `;}).join('');

  tbody._results = results; // full results, indexed by global data-idx

  // Click row → pan map to marker & open popup
  tbody.querySelectorAll('.result-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const r = tbody._results[tr.dataset.idx];
      const marker = markers.find(m => m._youautoIdx === parseInt(tr.dataset.idx));
      if (marker) {
        map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 12), { duration: 0.6 });
        marker.openPopup();
      }
      highlightTableRow(parseInt(tr.dataset.idx));
    });
  });

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} id="prevPage">← Prev</button>`;

  // Show page numbers around current page
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  if (start > 1) html += `<button class="page-btn">1</button>`;
  if (start > 2) html += `<span class="page-info">…</span>`;
  for (let p = start; p <= end; p++) {
    html += `<button class="page-btn ${p === currentPage ? 'active' : ''}">${p}</button>`;
  }
  if (end < totalPages - 1) html += `<span class="page-info">…</span>`;
  if (end < totalPages) html += `<button class="page-btn">${totalPages}</button>`;

  html += `<button ${currentPage === totalPages ? 'disabled' : ''} id="nextPage">Next →</button>`;
  el.innerHTML = html;

  // Wire up buttons
  el.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = parseInt(btn.textContent);
      renderTable(currentResults);
    });
  });
  const prev = el.querySelector('#prevPage');
  const next = el.querySelector('#nextPage');
  if (prev) prev.addEventListener('click', () => { currentPage--; renderTable(currentResults); });
  if (next) next.addEventListener('click', () => { currentPage++; renderTable(currentResults); });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Column sorting ──
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (currentSort.col === col) { currentSort.asc = !currentSort.asc; }
    else { currentSort.col = col; currentSort.asc = true; }
    if (currentResults.length && lastSearchLat != null) {
      currentPage = 1;
      sortResults(currentResults, currentSort.col, currentSort.asc);
      renderTable(currentResults);
      addMarkers(currentResults, lastSearchLat, lastSearchLon);
    }
  });
});

// ── Event listeners ──
document.getElementById('searchBtn').addEventListener('click', doSearch);

document.getElementById('useLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation not supported by your browser.'); return; }
  document.getElementById('geocodeStatus').textContent = 'Getting your location…';
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const addr = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
      document.getElementById('address').value = addr;
      doSearch();
    },
    err => { alert('Could not get location: ' + err.message); }
  );
});

document.querySelectorAll('input').forEach(inp => {
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
});

// ── Boot ──
(async function boot() {
  document.getElementById('tableBody').innerHTML =
    `<tr><td colspan="5" class="empty">Loading data files…</td></tr>`;
  await loadData();
  doSearch();
})();
</script>
</body>
</html>
