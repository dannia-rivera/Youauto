<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouAuto — Service Finder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dde1e6;
    --text: #1a1c23;
    --text-secondary: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --row-hover: #f0f4ff;
    --badge-bg: #e8edf9;
    --badge-text: #3b5998;
    --radius: 10px;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

  h1 {
    font-size: 1.8rem; font-weight: 700;
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text-secondary); margin-bottom: 28px; font-size: 0.95rem; }

  /* --- INPUT CARD --- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }

  .input-row {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
  .field input {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 0.95rem; width: 170px; transition: border-color .15s;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .field.wide input { width: 260px; }

  button {
    padding: 10px 22px; border: none; border-radius: 7px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }

  /* --- RESULTS HEADER --- */
  .results-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
  }
  .results-header h2 { font-size: 1.15rem; font-weight: 600; }
  .count { font-size: 0.85rem; color: var(--text-secondary); }

  /* --- TABLE --- */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th {
    text-align: left; padding: 12px 14px;
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-secondary); border-bottom: 2px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text); }
  th .arrow { margin-left: 3px; font-size: 0.65rem; }
  td { padding: 10px 14px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
  tr.result-row { cursor: pointer; transition: background .1s; }
  tr.result-row:hover { background: var(--row-hover); }
  tr.result-row:last-child td { border-bottom: none; }

  .name-cell { font-weight: 600; }
  .dist-badge {
    display: inline-block; background: var(--accent); color: #fff;
    padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
    white-space: nowrap;
  }
  .svc-badge {
    display: inline-block; background: var(--badge-bg); color: var(--badge-text);
    padding: 2px 9px; border-radius: 4px; font-size: 0.78rem;
    margin: 1px 3px 1px 0;
  }
  .source-tag {
    display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 7px;
    border-radius: 3px; text-transform: uppercase; letter-spacing: .04em;
  }
  .src-mech { background: #dbeafe; color: #1e40af; }
  .src-tow  { background: #fef3c7; color: #92400e; }

  .empty {
    text-align: center; padding: 48px 20px; color: var(--text-secondary);
    font-size: 0.95rem;
  }

  .detail-panel {
    display: none; margin-top: 12px; padding: 16px 20px;
    background: #f9fafb; border-radius: var(--radius);
    border: 1px solid var(--border); font-size: 0.85rem;
  }
  .detail-panel.open { display: block; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .detail-item { }
  .detail-item .k { font-weight: 600; color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; }
  .detail-item .v { }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .use-my-location {
    font-size: 0.82rem; color: var(--accent); cursor: pointer; background: none; border: none;
    padding: 0; font-weight: 500; text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">

  <h1>🔧 You<span>Auto</span></h1>
  <p class="subtitle">Nebraska auto service finder — mechanics & towing sorted by distance</p>

  <div class="card">
    <div class="input-row">
      <div class="field" style="flex:1; min-width:280px;">
        <label for="address">Address or place</label>
        <input id="address" type="text" placeholder="e.g. 123 Main St, Omaha, NE or just Lincoln, NE" value="Lincoln, NE">
      </div>
      <button id="useLocationBtn" class="use-my-location" style="text-decoration:none; background:none; color:var(--accent); padding:0; align-self:flex-end; margin-bottom:2px;">
        📍 Use my location
      </button>
      <div class="field" style="flex:1; min-width:220px;">
        <label for="service">Service filter (optional)</label>
        <input id="service" type="text" placeholder="e.g. transmission, towing, oil change, brakes…">
      </div>
      <button id="searchBtn">Search</button>
    </div>
    <div id="geocodeStatus" style="font-size:0.8rem; color:var(--text-secondary); margin-top:8px; min-height:1.2em;"></div>
  </div>

  <div id="resultsArea">
    <div class="results-header">
      <h2>Results</h2>
      <span class="count" id="resultCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-col="distance">Dist</th>
            <th data-col="name">Name</th>
            <th data-col="city">City</th>
            <th data-col="source">Source</th>
            <th data-col="services">Services</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>

</div>

<script>
// ── CSV parser (handles quoted fields & embedded commas) ──
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) {
        row.push(field);
        rows.push(row);
        row = []; field = '';
        if (ch === '\r') i++;
      } else if (ch === '\r') {
        row.push(field);
        rows.push(row);
        row = []; field = '';
      }
      else { field += ch; }
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// ── Haversine distance in miles ──
function toRad(d) { return d * Math.PI / 180; }
function haversineMiles(lat1, lon1, lat2, lon2) {
  const R = 3958.8; // earth radius in miles
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── Global state ──
let allRows = [];
let currentSort = { col: 'distance', asc: true };

// ── Load CSVs ──
async function loadData() {
  try {
    const ts = Date.now();
    const [mechResp, towResp] = await Promise.all([
      fetch(`ne_mechanics.csv?t=${ts}`), fetch(`ne_towing.csv?t=${ts}`)
    ]);
    const mechText = await mechResp.text();
    const towText  = await towResp.text();

    const mechRows = parseCSV(mechText);
    const towRows  = parseCSV(towText);

    // Assume first row is header
    const mechHeader = mechRows[0];
    const towHeader  = towRows[0];

    // Build column index maps
    const mIdx = {};
    mechHeader.forEach((h, i) => { mIdx[h.trim().toLowerCase()] = i; });
    const tIdx = {};
    towHeader.forEach((h, i) => { tIdx[h.trim().toLowerCase()] = i; });

    allRows = [];

    // Mechanics
    for (let r = 1; r < mechRows.length; r++) {
      const row = mechRows[r];
      const lat = parseFloat(row[mIdx.lat]);
      const lon = parseFloat(row[mIdx.lon]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const name = (row[mIdx.name] || '').trim();
      if (!name) continue; // skip unnamed entries
      allRows.push({
        name,
        city: row[mIdx.city] || '',
        state: row[mIdx.state] || '',
        lat, lon,
        address: row[mIdx.address] || '',
        phone: row[mIdx.phone] || '',
        website: row[mIdx.website] || '',
        hours: row[mIdx.opening_hours] || '',
        services: (row[mIdx.services] || '').split(';').map(s => s.trim()).filter(Boolean),
        osm_url: row[mIdx.osm_url] || '',
        source: 'Mechanic',
      });
    }

    // Towing
    for (let r = 1; r < towRows.length; r++) {
      const row = towRows[r];
      const lat = parseFloat(row[tIdx.lat]);
      const lon = parseFloat(row[tIdx.lon]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const name = (row[tIdx.name] || '').trim();
      if (!name) continue; // skip unnamed entries
      allRows.push({
        name,
        city: row[tIdx.city] || '',
        state: row[tIdx.state] || '',
        lat, lon,
        address: row[tIdx.address] || '',
        phone: row[tIdx.phone] || '',
        website: row[tIdx.website] || '',
        hours: row[tIdx.opening_hours] || '',
        services: (row[tIdx.services] || '').split(';').map(s => s.trim()).filter(Boolean),
        osm_url: row[tIdx.osm_url] || '',
        source: 'Towing',
      });
    }

    const withCity = allRows.filter(r => r.city).length;
    console.log(`Loaded ${allRows.length} entries (${mechRows.length - 1} mechanics, ${towRows.length - 1} towing) — ${withCity} with city`);
  } catch (err) {
    console.error('Failed to load CSV files:', err);
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="5" class="empty">⚠️ Could not load data files. Make sure you're serving this directory (e.g. <code>python -m http.server 8080</code>).</td></tr>`;
  }
}

// ── Geocode address via OpenStreetMap Nominatim ──
async function geocode(address) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!data.length) return null;
  return {
    lat: parseFloat(data[0].lat),
    lon: parseFloat(data[0].lon),
    display: data[0].display_name,
  };
}

// ── Reverse geocode coords to address ──
async function reverseGeocode(lat, lon) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
  const resp = await fetch(url);
  const data = await resp.json();
  return data.display_name || `${lat}, ${lon}`;
}

// ── Search & render ──
async function doSearch() {
  const address = document.getElementById('address').value.trim();
  const svcFilter = document.getElementById('service').value.trim().toLowerCase();
  const statusEl = document.getElementById('geocodeStatus');

  if (!address) {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="5" class="empty">Please enter an address or place name.</td></tr>`;
    return;
  }

  statusEl.textContent = 'Looking up address…';
  const geo = await geocode(address);
  if (!geo) {
    statusEl.textContent = '';
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="5" class="empty">Could not find that address. Try being more specific (e.g. "123 Main St, Omaha, NE").</td></tr>`;
    return;
  }
  statusEl.textContent = `📍 ${geo.display}`;
  const { lat, lon } = geo;

  let results = allRows.map(r => ({
    ...r,
    distance: haversineMiles(lat, lon, r.lat, r.lon)
  }));

  // Filter by service
  if (svcFilter) {
    results = results.filter(r =>
      r.services.some(s => s.toLowerCase().includes(svcFilter)) ||
      r.name.toLowerCase().includes(svcFilter)
    );
  }

  sortResults(results, currentSort.col, currentSort.asc);
  renderTable(results);
}

function sortResults(results, col, asc) {
  results.sort((a, b) => {
    let va, vb;
    switch (col) {
      case 'distance': va = a.distance; vb = b.distance; break;
      case 'name':     va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'city':     va = a.city.toLowerCase(); vb = b.city.toLowerCase(); break;
      case 'source':   va = a.source; vb = b.source; break;
      default:         va = a.distance; vb = b.distance;
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
}

function renderTable(results) {
  const tbody = document.getElementById('tableBody');
  document.getElementById('resultCount').textContent =
    `${results.length} result${results.length !== 1 ? 's' : ''}`;

  if (!results.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No results found. Try a different location or service filter.</td></tr>`;
    document.getElementById('detailPanel').classList.remove('open');
    return;
  }

  tbody.innerHTML = results.map((r, i) => `
    <tr class="result-row" data-idx="${i}" data-name="${escHtml(r.name)}" title="${r.osm_url ? 'Click to open OpenStreetMap' : 'Click for details'}">
      <td><span class="dist-badge">${r.distance.toFixed(1)} mi</span></td>
      <td class="name-cell">${escHtml(r.name)}</td>
      <td>${escHtml(r.city || '—')}</td>
      <td><span class="source-tag ${r.source === 'Mechanic' ? 'src-mech' : 'src-tow'}">${r.source}</span></td>
      <td>${r.services.slice(0, 5).map(s => `<span class="svc-badge">${escHtml(s)}</span>`).join('')}${r.services.length > 5 ? ` +${r.services.length - 5} more` : ''}</td>
    </tr>
  `).join('');

  // Store results for detail view
  tbody._results = results;

  // Click handler — open OpenStreetMap node in new tab
  tbody.querySelectorAll('.result-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const r = tbody._results[tr.dataset.idx];
      if (r.osm_url) {
        window.open(r.osm_url, '_blank');
      } else {
        showDetail(r);
      }
    });
  });
}

function showDetail(r) {
  const panel = document.getElementById('detailPanel');
  panel.classList.add('open');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong style="font-size:1.05rem;">${escHtml(r.name)}</strong>
      <span class="source-tag ${r.source === 'Mechanic' ? 'src-mech' : 'src-tow'}">${r.source}</span>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="k">Distance</div><div class="v">${r.distance.toFixed(1)} miles</div></div>
      <div class="detail-item"><div class="k">Address</div><div class="v">${escHtml(r.address || '—')}</div></div>
      <div class="detail-item"><div class="k">City</div><div class="v">${escHtml(r.city || '—')}, ${escHtml(r.state || 'NE')}</div></div>
      <div class="detail-item"><div class="k">Phone</div><div class="v">${r.phone ? `<a href="tel:${escHtml(r.phone)}">${escHtml(r.phone)}</a>` : '—'}</div></div>
      <div class="detail-item"><div class="k">Website</div><div class="v">${r.website ? `<a href="${escHtml(r.website)}" target="_blank">${escHtml(r.website)}</a>` : '—'}</div></div>
      <div class="detail-item"><div class="k">Hours</div><div class="v">${escHtml(r.hours || '—')}</div></div>
    </div>
    <div style="margin-top:10px;"><span class="k" style="font-weight:600;color:var(--text-secondary);font-size:0.75rem;text-transform:uppercase;">Services</span><br>
      ${r.services.length ? r.services.map(s => `<span class="svc-badge">${escHtml(s)}</span>`).join(' ') : '—'}
    </div>
  `;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Column sorting ──
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (currentSort.col === col) { currentSort.asc = !currentSort.asc; }
    else { currentSort.col = col; currentSort.asc = true; }
    doSearch();
  });
});

// ── Event listeners ──
document.getElementById('searchBtn').addEventListener('click', doSearch);

document.getElementById('useLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation not supported by your browser.'); return; }
  document.getElementById('geocodeStatus').textContent = 'Getting your location…';
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const addr = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
      document.getElementById('address').value = addr;
      doSearch();
    },
    err => { alert('Could not get location: ' + err.message); }
  );
});

// Trigger search on Enter in any input
document.querySelectorAll('input').forEach(inp => {
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
});

// ── Boot ──
(async function boot() {
  document.getElementById('tableBody').innerHTML =
    `<tr><td colspan="5" class="empty">Loading data files…</td></tr>`;
  await loadData();
  doSearch(); // initial search with default address (Lincoln, NE)
})();
</script>
</body>
</html>
